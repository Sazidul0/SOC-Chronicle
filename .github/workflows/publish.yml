# Publish to PyPI when a GitHub Release is created.
#
# Security: Uses PyPI Trusted Publishers (OIDC) — no API tokens needed.
# Setup: Configure Trusted Publisher on pypi.org/manage/project/.../settings/publishing/
#   - Owner: Sazidul0
#   - Repository: SOC-Chronicle
#   - Workflow: publish.yml
#   - Environment: pypi
#
# Alternatively, if Trusted Publisher is not configured, this workflow
# falls back to using the PYPI_API_TOKEN secret stored in GitHub Secrets.

name: Publish to PyPI

on:
  release:
    types: [published]

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Phase 1: Run the full test suite before publishing anything
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src/soc_chronicle

      - name: Bandit Security Scan
        run: bandit -c pyproject.toml -r src/

      - name: Safety Check
        run: pip-audit --skip-editable

      - name: Pytest
        run: pytest --cov=soc_chronicle --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────────────
  # Phase 2: Build the package and verify artifacts
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────
  # Phase 3: Publish to Production PyPI
  # ──────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
