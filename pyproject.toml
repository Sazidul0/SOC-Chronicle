[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-chronicle"
version = "0.2.0"
description = "Professional SOC investigation, threat hunting, and incident narrative engine for security analysts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "soc-chronicle contributors" }]
keywords = [
    "security", "soc", "incident-response", "threat-hunting", "forensics",
    "ocsf", "mitre-attack", "duckdb", "siem", "edr", "log-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28.0",
    "networkx>=3.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "rich>=13.9",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "mkdocs-material>=9.6",
    "mypy>=1.14",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pip-audit>=2.7",
    "types-networkx>=3.0",
    "types-PyYAML>=6.0",
]
# Windows EVTX binary log file parsing
evtx = ["python-evtx>=0.7"]
# File-watching / directory monitoring (polling fallback built-in, watchdog optional)
watch = ["watchdog>=4.0"]
# HTTP webhook server for Filebeat/Vector/Fluent Bit ingestion
serve = ["aiohttp>=3.9"]
# PDF report export (large optional dependency)
pdf = ["weasyprint>=62.0"]
# All connectors + PDF
all = [
    # dev
    "bandit[toml]>=1.7",
    "mkdocs-material>=9.6",
    "mypy>=1.14",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pip-audit>=2.7",
    "types-networkx>=3.0",
    "types-PyYAML>=6.0",
    # connectors
    "python-evtx>=0.7",
    "watchdog>=4.0",
    "aiohttp>=3.9",
    # pdf
    "weasyprint>=62.0",
]

[project.scripts]
chronicle = "soc_chronicle.cli.main:app"

[project.urls]
Homepage = "https://github.com/Sazidul0/SOC-Chronicle"
Documentation = "https://github.com/Sazidul0/SOC-Chronicle"
Repository = "https://github.com/Sazidul0/SOC-Chronicle"
Issues = "https://github.com/Sazidul0/SOC-Chronicle/issues"
Changelog = "https://github.com/Sazidul0/SOC-Chronicle/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_chronicle"]

[tool.hatch.build.targets.sdist]
include = ["src/soc_chronicle", "tests", "examples", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soc_chronicle"]

[tool.coverage.run]
source = ["soc_chronicle"]
branch = true
